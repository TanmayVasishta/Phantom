<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANTOM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgba(18, 18, 20, 0.96);
    --surface: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --text: rgba(255,255,255,0.88);
    --text-dim: rgba(255,255,255,0.38);
    --text-mid: rgba(255,255,255,0.55);
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --radius: 16px;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  }

  #app {
    width: 100%;
    background: var(--bg);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: fadeIn 0.15s ease;
    min-height: 64px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* HEADER */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 48px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #header-title {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--text-mid);
    text-transform: uppercase;
  }

  #lock-icon {
    font-size: 14px;
    transition: filter 0.3s ease, color 0.3s ease;
    color: var(--text-dim);
  }

  #lock-icon.active {
    filter: drop-shadow(0 0 6px var(--green));
    color: var(--green);
  }

  /* RESPONSE AREA */
  #response-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    min-height: 0;
    display: none;
  }

  #response-area::-webkit-scrollbar { width: 4px; }
  #response-area::-webkit-scrollbar-track { background: transparent; }
  #response-area::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
  }
  #response-area::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.25);
  }

  #response-content {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #response-content strong { color: #fff; font-weight: 600; }

  #response-content code {
    background: rgba(255,255,255,0.08);
    padding: 2px 7px;
    border-radius: 5px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    color: #a5b4fc;
  }

  #response-content pre {
    background: rgba(255,255,255,0.05);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 10px 0;
    overflow-x: auto;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    color: #c4b5fd;
    line-height: 1.6;
  }

  /* TYPING INDICATOR */
  #typing-indicator {
    display: none;
    padding: 16px 24px;
    gap: 6px;
    align-items: center;
  }

  #typing-indicator span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    display: inline-block;
    animation: bounce 1.2s ease infinite;
  }

  #typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  #typing-indicator span:nth-child(3) { animation-delay: 0.30s; }

  @keyframes bounce {
    0%,100% { opacity: 0.2; transform: scale(0.75); }
    50%      { opacity: 1;   transform: scale(1); }
  }

  /* HITL MODAL */
  #hitl-modal {
    display: none;
    margin: 0 16px 12px;
    background: rgba(28, 16, 16, 0.97);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 12px;
    padding: 16px 20px;
    animation: slideIn 0.2s ease;
  }

  #hitl-modal .hitl-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--amber);
    margin-bottom: 12px;
  }

  #hitl-modal .hitl-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }

  #hitl-modal .hitl-label {
    color: var(--text-dim);
    width: 52px;
    flex-shrink: 0;
  }

  #hitl-modal .hitl-value {
    color: var(--text-mid);
    font-family: 'Cascadia Code', monospace;
    font-size: 11px;
    word-break: break-all;
  }

  #hitl-risk {
    font-weight: 700;
    font-size: 13px;
  }

  #hitl-modal .hitl-buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .hitl-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .hitl-btn.approve {
    background: var(--green);
    color: #fff;
  }
  .hitl-btn.approve:hover { background: #16a34a; }

  .hitl-btn.reject {
    background: var(--red);
    color: #fff;
  }
  .hitl-btn.reject:hover { background: #dc2626; }

  /* INPUT ROW */
  #input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 16px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
  }

  #input-row:focus-within {
    border-color: rgba(99,102,241,0.55);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  }

  #query-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 14px 0;
    caret-color: var(--accent);
  }

  #query-input::placeholder { color: var(--text-dim); }

  #query-input:disabled {
    color: var(--text-dim);
    cursor: not-allowed;
  }

  #send-hint {
    font-size: 18px;
    color: var(--text-dim);
    cursor: pointer;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  #send-hint:hover {
    background: rgba(99,102,241,0.3);
    color: #a5b4fc;
  }

  /* STATUS BAR */
  #status-bar {
    display: none;
    padding: 7px 24px;
    background: rgba(0,0,0,0.25);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  #status-bar .provider-name {
    color: var(--text-mid);
  }

  #idle-hint {
    padding: 10px 24px 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    display: block;
  }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <span id="header-title">&mdash;&nbsp;&nbsp;PHANTOM&nbsp;&nbsp;&mdash;</span>
    <span id="lock-icon" title="PII Protection">&#128274;</span>
  </div>

  <!-- Idle hint -->
  <div id="idle-hint">Type a query below and press Enter</div>

  <!-- Response area -->
  <div id="response-area">
    <div id="response-content"></div>
  </div>

  <!-- Typing indicator -->
  <div id="typing-indicator">
    <div style="color: var(--accent); font-size: 13px; font-weight: 600; margin-right: 8px;">Processing...</div>
    <span></span><span></span><span></span>
  </div>

  <!-- HITL Modal -->
  <div id="hitl-modal">
    <div class="hitl-title">&#9888;&nbsp; High-risk action detected</div>
    <div class="hitl-row">
      <span class="hitl-label">Action</span>
      <span class="hitl-value" id="hitl-action">—</span>
    </div>
    <div class="hitl-row">
      <span class="hitl-label">Intent</span>
      <span class="hitl-value" id="hitl-intent">—</span>
    </div>
    <div class="hitl-row">
      <span class="hitl-label">Risk</span>
      <span id="hitl-risk">—</span>
    </div>
    <div class="hitl-buttons">
      <button class="hitl-btn approve" onclick="handleHITL('approve')">&#10003;&nbsp; Approve</button>
      <button class="hitl-btn reject"  onclick="handleHITL('reject')">&#10007;&nbsp; Reject</button>
    </div>
  </div>

  <!-- Input row -->
  <div id="input-row">
    <input
      id="query-input"
      type="text"
      placeholder="Ask PHANTOM anything..."
      autocomplete="off"
      spellcheck="false"
    />
    <div id="send-hint" onclick="submitQuery()" title="Send (Enter)">&#x23CE;</div>
  </div>

  <!-- Status bar -->
  <div id="status-bar"></div>
</div>

<script>
  const API = 'http://127.0.0.1:8747';
  let threadId = generateUUID();
  let ws = null;
  let locked = false;
  let pendingHITL = null;
  let backendReady = false;
  let healthPollTimer = null;

  // DOM refs
  const input        = document.getElementById('query-input');
  const responseArea = document.getElementById('response-area');
  const responseContent = document.getElementById('response-content');
  const typingIndicator = document.getElementById('typing-indicator');
  const statusBar    = document.getElementById('status-bar');
  const lockIcon     = document.getElementById('lock-icon');
  const hitlModal    = document.getElementById('hitl-modal');
  const idleHint     = document.getElementById('idle-hint');

  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function lockInput()   { locked = true;  input.readOnly = true; }
  function unlockInput() { locked = false; input.readOnly = false; input.focus(); }

  function showTyping() {
    typingIndicator.style.display = 'flex';
    responseArea.style.display = 'none';
    idleHint.style.display = 'none';
    updateHeight();
  }

  function hideTyping() {
    typingIndicator.style.display = 'none';
  }

  function showResponse(html) {
    hideTyping();
    responseContent.innerHTML = html;
    responseArea.style.display = 'block';
    responseArea.scrollTop = responseArea.scrollHeight;
    updateHeight();
  }

  // ── Startup gate ─────────────────────────────────────────────────────────
  // The window can appear (and accept focus) before the FastAPI backend is
  // listening — model warm-up alone takes ~80s. Without this gate, a query
  // typed during that window opens a WebSocket that fails immediately, and
  // the failure could go unnoticed. Input stays disabled until /health
  // genuinely returns 200.

  function disableInputForStartup() {
    backendReady = false;
    input.disabled = true;
    responseContent.innerHTML = '<span style="color:var(--text-mid)">PHANTOM initialising&hellip;</span>';
    responseArea.style.display = 'block';
    idleHint.style.display = 'none';
    updateHeight();
  }

  function enableInputAfterStartup() {
    if (backendReady) return;
    backendReady = true;
    if (healthPollTimer) { clearTimeout(healthPollTimer); healthPollTimer = null; }
    input.disabled = false;
    responseContent.innerHTML = '';
    responseArea.style.display = 'none';
    idleHint.style.display = 'block';
    input.focus();
    updateHeight();
  }

  function showStartupFailure() {
    input.disabled = true;
    responseContent.innerHTML =
      '<span style="color:var(--red)">Backend failed to start. Please restart PHANTOM.</span>';
    responseArea.style.display = 'block';
    updateHeight();
  }

  function pollBackendHealth() {
    const HEALTH_POLL_INTERVAL_MS = 2000;
    const HEALTH_TIMEOUT_MS = 120000;
    const deadline = Date.now() + HEALTH_TIMEOUT_MS;

    function check() {
      fetch(`${API}/health`, { cache: 'no-store' })
        .then(res => {
          if (res.ok) {
            enableInputAfterStartup();
          } else {
            scheduleNext();
          }
        })
        .catch(() => scheduleNext());
    }

    function scheduleNext() {
      if (backendReady) return;
      if (Date.now() >= deadline) {
        showStartupFailure();
        return;
      }
      healthPollTimer = setTimeout(check, HEALTH_POLL_INTERVAL_MS);
    }

    check();
  }

  // Called from Python (ui/phantom_window.py) when wait_for_api() already
  // confirmed the backend is up, so the poll loop doesn't have to catch up
  // on its own 2s cadence.
  function __phantomBackendReadyHint() {
    enableInputAfterStartup();
  }

  function updateHeight() {
    setTimeout(() => {
      const h = document.getElementById('app').scrollHeight;
      if (window.phantom && window.phantom.setHeight) {
        window.phantom.setHeight(Math.min(h, 520));
      }
    }, 50);
  }

  function renderMarkdown(text) {
    if (!text) return '';
    // Code blocks
    text = text.replace(/```([\s\S]*?)```/g, (_, c) =>
      `<pre>${escapeHtml(c.trim())}</pre>`);
    // Inline code
    text = text.replace(/`([^`]+)`/g, (_, c) =>
      `<code>${escapeHtml(c)}</code>`);
    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    // Bullet points
    text = text.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
    text = text.replace(/((<li>.*<\/li>\n?)+)/g, '<ul style="padding-left:18px;margin:6px 0">$1</ul>');
    // Line breaks
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateStatus(result) {
    const parts = [];
    const pii = result.n_pii_redacted || result.n_pii || 0;
    if (pii > 0) parts.push(`&#128737; ${pii} PII stripped`);
    const provider = result.provider_used || 'local';
    parts.push(`<span class="provider-name">${provider}</span>`);
    if (result.latency_ms) parts.push(`${result.latency_ms}ms`);
    const hits = result.memory_hits || 0;
    if (hits > 0) parts.push(`${hits} memory hits`);
    statusBar.innerHTML = parts.join('&nbsp;&nbsp;&middot;&nbsp;&nbsp;');
    statusBar.style.display = 'block';
  }

  function updateLockIcon(piiCount) {
    if (piiCount > 0) {
      lockIcon.classList.add('active');
    } else {
      lockIcon.classList.remove('active');
    }
  }

  function showHITLModal(result) {
    pendingHITL = result;
    document.getElementById('hitl-action').textContent =
      (result.raw_input || result.response || '—').substring(0, 90);
    document.getElementById('hitl-intent').textContent = result.intent || '—';
    const riskEl = document.getElementById('hitl-risk');
    const risk = result.risk_score || 0;
    riskEl.textContent = (risk * 100).toFixed(0) + '%';
    riskEl.style.color = risk > 0.8 ? 'var(--red)' : 'var(--amber)';
    hitlModal.style.display = 'block';
    updateHeight();
  }

  function hideHITLModal() {
    hitlModal.style.display = 'none';
    pendingHITL = null;
  }

  async function handleHITL(decision) {
    hideHITLModal();
    showTyping();
    lockInput();
    try {
      const res = await fetch(`${API}/resume`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision, thread_id: threadId })
      });
      const result = await res.json();
      const text = result.final_response || result.response || 'Done.';
      showResponse(renderMarkdown(text));
      updateStatus(result);
      updateLockIcon(result.n_pii_redacted || result.n_pii || 0);
    } catch (e) {
      showResponse(`<span style="color:var(--red)">Resume error: ${e.message}</span>`);
    }
    unlockInput();
  }

  function submitQuery() {
    if (!backendReady) return;
    const query = input.value.trim();
    if (!query || locked) return;
    input.value = '';
    idleHint.style.display = 'none';
    hideHITLModal();
    showTyping();
    lockInput();

    // Close previous WebSocket
    if (ws) { try { ws.close(); } catch(e) {} }

    let buffer = '';
    let gotToken = false;
    // Tracks whether this submission has already produced a visible result
    // (success, error, or the connection-error fallback message) and been
    // unlocked. onclose uses it to avoid double-handling — or, if nothing
    // else ever fired, to guarantee the input is never left locked in silence.
    let settled = false;
    let fallbackStarted = false;

    const CONNECTION_ERROR_HTML =
      '<span style="color:var(--red)">Connection error: PHANTOM backend not reachable. ' +
      'Please wait for startup to complete.</span>';

    ws = new WebSocket(`ws://127.0.0.1:8747/stream`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ query, thread_id: threadId }));
    };

    ws.onmessage = (e) => {
      let data;
      try {
        data = JSON.parse(e.data);
      } catch (parseErr) {
        console.error('PHANTOM: malformed WebSocket frame:', e.data, parseErr);
        settled = true;
        showResponse('Error: received malformed response from backend.');
        unlockInput();
        return;
      }

      if (data.type === 'token') {
        buffer += data.content;
        gotToken = true;
        showResponse(renderMarkdown(buffer));
      } else if (data.type === 'done') {
        settled = true;
        hideTyping();
        const result = data.result || {};
        const text = result.final_response || result.response || buffer || 'Done.';
        showResponse(renderMarkdown(text));
        updateStatus(result);
        updateLockIcon(result.n_pii_redacted || result.n_pii || 0);
        if (result.hitl_required) {
          result.raw_input = query;
          showHITLModal(result);
        } else {
          unlockInput();
        }
      } else if (data.type === 'error') {
        settled = true;
        hideTyping();
        showResponse(`<span style="color:var(--red)">Error: ${data.message}</span>`);
        unlockInput();
      }
    };

    ws.onerror = () => {
      hideTyping();
      fallbackStarted = true;
      // Fallback to REST
      fetch(`${API}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, thread_id: threadId })
      }).then(r => r.json()).then(result => {
        settled = true;
        const text = result.final_response || result.response || 'Done.';
        showResponse(renderMarkdown(text));
        updateStatus(result);
        updateLockIcon(result.n_pii_redacted || result.n_pii || 0);
        if (result.hitl_required) {
          result.raw_input = query;
          showHITLModal(result);
        } else {
          unlockInput();
        }
      }).catch(() => {
        settled = true;
        showResponse(CONNECTION_ERROR_HTML);
        unlockInput();
      });
    };

    ws.onclose = () => {
      ws = null;
      // Nothing else ever resolved this submission (e.g. the socket closed
      // before onerror's fallback fetch even started) — never leave the
      // input silently locked.
      if (!settled && !fallbackStarted) {
        settled = true;
        hideTyping();
        showResponse(CONNECTION_ERROR_HTML);
        unlockInput();
      }
    };
  }

  // Enter key handler
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitQuery();
    }
  });

  // Gate input until the backend is confirmed reachable (see "Startup gate"
  // above) instead of focusing immediately — see Fix 1.
  disableInputForStartup();
  pollBackendHealth();
</script>
</body>
</html>
